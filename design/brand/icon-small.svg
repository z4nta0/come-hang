<?xml version='1.0' encoding='UTF-8'?>
<svg
	viewBox='0 0 64 64'
	xmlns='http://www.w3.org/2000/svg'
><!-- What: Come Hang Small Icon SVG Element. Why: Three typing dots blur together at about 32 pixels, so small sizes need a simpler mark. How: This draws the same tilted pin on its tile with one coral dot in place of the three. -->


	<rect
		fill='#4A4FC9'
		height='64'
		rx='14'
		width='64'
	/><!-- What: Icon Tile Rect Element. Why: The mark sits on the brand's periwinkle. How: This fills the drawing space with a rounded square. -->


	<g transform='translate(-1.78 1.67)'><!-- What: Mark Center Group Element. Why: Tilting the pin leaves it off center in its drawing space. How: This shifts the mark and its dot so the tilted shape's bounds center on the tile. -->


		<g transform='rotate(35 32 30)'><!-- What: Mark Tilt Group Element. Why: Tipping the pin over turns its point into a speech bubble's tail. How: This rotates the pin 35 degrees clockwise around the middle of its head. -->


			<path
				d='M32 58 C31.3 54.6 25.35 51 22.5 47.25 C17.75 41 13 33 13 26 a19 19 0 0 1 38 0 C51 40 32 58 32 58 Z'
				fill='#FFFFFF'
			/><!-- What: Mark Pin Path Element. Why: One shape reads as both a map pin and a chat bubble. How: This draws the pin with a subtle inward curve on its upper edge just above the tip, the cut that suggests a bubble's tail. -->


		</g>

		<circle
			cx='34.3'
			cy='26.7'
			fill='#E9735D'
			r='6'
		/><!-- What: Coral Dot Circle Element. Why: One larger dot keeps the brand's coral spark where three small ones would blur. How: This draws it in the middle of the pin's head. -->


	</g>


</svg>
