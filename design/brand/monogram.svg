<?xml version='1.0' encoding='UTF-8'?>
<svg
	viewBox='0 0 64 64'
	xmlns='http://www.w3.org/2000/svg'
><!-- What: Come Hang Monogram SVG Element. Why: The ch monogram from the design pass wasn't chosen as the icon but may serve elsewhere later, so it's kept here unused. How: This draws the initials in the heading font with a coral dot on a periwinkle tile, as live text that needs Bricolage Grotesque installed and converting to outlines before any real use. -->


	<rect
		fill='#4A4FC9'
		height='64'
		rx='14'
		width='64'
	/><!-- What: Icon Tile Rect Element. Why: The monogram sits on the brand's periwinkle. How: This fills the drawing space with a rounded square. -->

	<text
		fill='#FFFFFF'
		font-family='Bricolage Grotesque, sans-serif'
		font-size='36'
		font-weight='800'
		letter-spacing='-1'
		text-anchor='middle'
		x='32'
		y='44'
	>ch</text><!-- What: Monogram Initials Text Element. Why: The app's initials in its heading font make a quiet, typographic mark. How: This centers the lowercase ch on the tile. -->

	<circle
		cx='49'
		cy='18'
		fill='#FFB3A1'
		r='4.5'
	/><!-- What: Coral Dot Circle Element. Why: A small spark of the brand's coral keeps the monogram from being plain. How: This draws it up and to the right of the h. -->


</svg>
