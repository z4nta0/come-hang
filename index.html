


<!doctype html> <!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'> <!-- What: Root HTML Element. Why: Screen readers and translation tools need the page's language. How: This marks the document as English. -->


	<head> <!-- What: Document Head Element. Why: The page's metadata loads before the body paints. How: This holds it in the section below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                                                                     <!-- What: Character Set Meta. Why: The browser has to decode the page as UTF-8 before it reads anything else. How: This sits first in the head, inside the first 1,024 bytes the browser checks. -->
		<meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover' /> <!-- What: Viewport Meta. Why: Phones should lay the app out at device width instead of a zoomed-out desktop width, and the app should reach behind the system bars so they show its colors. How: This sets the layout width to the device's, starts at no zoom, and covers the whole screen, the parts behind the bars included. -->
		<title>Come Hang: plan get-togethers with your group</title>                                 <!-- What: Page Title Element. Why: The tab, bookmarks, and search results name the app by its title, and link checkers that never run the app's script read only this file. How: This names the app and what it's for, under 60 characters. -->

		<!-- #endregion Document -->


		<!-- #region Search -->

		<meta name='author' content='Come Hang' />            <!-- What: Author Meta. Why: Search engines and link tools can credit who made the app. How: This names the app itself, as a real product. -->
		<meta name='description' content="Plan get-togethers with your group in one place: chat, set the date, see who's bringing what, and find each other on the day." /> <!-- What: Description Meta. Why: Search results and link checkers show this summary, and many read only this file. How: This says what the app does in 125 characters, the most a phone's card shows. -->
		<link href='https://comehang.app/' rel='canonical' /> <!-- What: Canonical Link. Why: The app answers at one address, so search engines should credit every way of reaching it to that address. How: This names the live root. -->

		<!-- #endregion Search -->


		<!-- #region Web App -->

		<link href='/manifest.webmanifest' rel='manifest' />                                <!-- What: Manifest Link. Why: Installing the app to a home screen reads its name, icons, and display mode from the manifest. How: This points at the hand-written manifest in public/. -->
		<meta name='theme-color' content='#FFFFFF' media='(prefers-color-scheme: light)' /> <!-- What: Light Theme Color Meta. Why: Mobile browsers tint their bars around the page, and Discord edges its link previews in this color. How: This sets the header's white surface for a device in light mode, until the app keeps one tag in step with the mode showing. -->
		<meta name='theme-color' content='#1B1D38' media='(prefers-color-scheme: dark)' />  <!-- What: Dark Theme Color Meta. Why: The tinted bars should match the dark header too. How: This sets the header's navy surface for a device in dark mode, until the app keeps one tag in step with the mode showing. -->

		<!-- #endregion Web App -->


		<!-- #region Icons -->

		<link href='/favicon.svg' rel='icon' type='image/svg+xml' /> <!-- What: SVG Favicon Link. Why: Modern browsers draw a vector favicon sharp at every size. How: This points at the one-dot mark, rendered into public/ by npm run icons. -->
		<link href='/favicon.ico' rel='icon' />                      <!-- What: ICO Favicon Link. Why: Browsers without SVG favicons fall back to the ICO, which also answers the /favicon.ico request browsers make on their own. How: This points at the ICO, holding the mark at 16, 32, and 48px. -->

		<!-- #endregion Icons -->


		<!-- #region Home Screen -->

		<link href='/apple-touch-icon.png' rel='apple-touch-icon' sizes='180x180' /> <!-- What: Apple Touch Icon Link. Why: iOS draws the home screen icon, and some apps the icon beside a shared link, from this link. How: This points at the 180px icon on a square tile, which iOS rounds itself. -->

		<!-- #endregion Home Screen -->


		<!-- #region Open Graph -->

		<meta property='og:description'  content="Plan get-togethers with your group in one place: chat, set the date, see who's bringing what, and find each other on the day." /> <!-- What: Open Graph Description Meta. Why: Shared links show a summary under the title. How: This repeats the page's description. -->
		<meta property='og:image'        content='https://comehang.app/og-image.png' />             <!-- What: Open Graph Image Meta. Why: A shared link shows a card image. How: This points at the 1,200x630 card rendered by npm run og-image. -->
		<meta property='og:image:alt'    content='The Come Hang mark, a map pin tipped over into a chat bubble, above the words Come Hang: plan get-togethers with your group.' /> <!-- What: Open Graph Image Alt Meta. Why: Screen readers in the apps that show the card read its text. How: This describes the card's mark and words. -->
		<meta property='og:image:height' content='630' />                                           <!-- What: Open Graph Image Height Meta. Why: Apps lay the card out before it loads. How: This gives its height in pixels. -->
		<meta property='og:image:type'   content='image/png' />                                     <!-- What: Open Graph Image Type Meta. Why: Some apps check the image's type before fetching it. How: This names it a PNG. -->
		<meta property='og:image:width'  content='1200' />                                          <!-- What: Open Graph Image Width Meta. Why: Apps lay the card out before it loads. How: This gives its width in pixels. -->
		<meta property='og:locale'       content='en_US' />                                         <!-- What: Open Graph Locale Meta. Why: The card's text is US English. How: This names the locale in Open Graph's form. -->
		<meta property='og:site_name'    content='Come Hang' />                                     <!-- What: Open Graph Site Name Meta. Why: Some apps show the site's name above the title. How: This names the app. -->
		<meta property='og:title'        content='Come Hang: plan get-togethers with your group' /> <!-- What: Open Graph Title Meta. Why: A shared link shows a title. How: This repeats the page's title. -->
		<meta property='og:type'         content='website' />                                       <!-- What: Open Graph Type Meta. Why: Open Graph needs the kind of page. How: This marks it a website. -->
		<meta property='og:url'          content='https://comehang.app/' />                         <!-- What: Open Graph URL Meta. Why: A shared card should credit the app's one address. How: This names the live root. -->

		<!-- #endregion Open Graph -->


		<!-- #region Twitter Card -->

		<meta name='twitter:card'        content='summary_large_image' /> <!-- What: Twitter Card Meta. Why: X and apps reading its tags show a large image card only when asked. How: This asks for the large image card. -->
		<meta name='twitter:description' content="Plan get-togethers with your group in one place: chat, set the date, see who's bringing what, and find each other on the day." /> <!-- What: Twitter Description Meta. Why: X shows a summary under the title. How: This repeats the page's description. -->
		<meta name='twitter:image'       content='https://comehang.app/og-image.png' />                                                                                             <!-- What: Twitter Image Meta. Why: X shows the card image. How: This points at the same card as Open Graph. -->
		<meta name='twitter:image:alt'   content='The Come Hang mark, a map pin tipped over into a chat bubble, above the words Come Hang: plan get-togethers with your group.' />  <!-- What: Twitter Image Alt Meta. Why: X reads the card's text to screen readers. How: This describes the card's mark and words. -->
		<meta name='twitter:title'       content='Come Hang: plan get-togethers with your group' />                                                                                 <!-- What: Twitter Title Meta. Why: X shows a title. How: This repeats the page's title. -->

		<!-- #endregion Twitter Card -->


	</head>



	<body> <!-- What: Document Body Element. Why: This holds the app's mount point, the hidden form Netlify reads, and the entry script. How: The mount point stays empty until React renders the app into it. -->


		<div id='appMouDiv'></div> <!-- What: App Mount Div Element. Why: React needs one element to render the app into. How: main.tsx renders the app into this id. -->


		<form
			name='support'
			netlify
			netlify-honeypot='bot-field'

			hidden
		> <!-- What: Netlify Support Form Element. Why: Netlify registers a site's forms by reading the built HTML, and the app's support form exists only once React runs. How: This hidden copy carries the form's name and its fields' names, under IDs of its own, since the app's form uses the others. -->


			<label for='netSubInp'>Subject</label> <!-- What: Netlify Subject Label Element. Why: The subject field needs a label in Netlify's record of the form. How: This labels netSubInp. -->

			<input
				id='netSubInp'

				name='subject'

				type='text'
			/> <!-- What: Netlify Subject Input Element. Why: Netlify registers the subject field by its name. How: This declares it. -->

			<label for='netMesTex'>Message</label> <!-- What: Netlify Message Label Element. Why: The message field needs a label in Netlify's record of the form. How: This labels netMesTex. -->

			<textarea
				id='netMesTex'

				name='message'
			></textarea> <!-- What: Netlify Message Textarea Element. Why: Netlify registers the message field by its name. How: This declares it. -->

			<label for='netEmaInp'>Email</label> <!-- What: Netlify Email Label Element. Why: The email field needs a label in Netlify's record of the form. How: This labels netEmaInp. -->

			<input
				id='netEmaInp'

				name='email'

				type='text'
			/> <!-- What: Netlify Email Input Element. Why: Netlify registers the optional reply address by its name. How: This declares it. -->

			<label for='netVerInp'>Version</label> <!-- What: Netlify Version Label Element. Why: The version field needs a label in Netlify's record of the form. How: This labels netVerInp. -->

			<input
				id='netVerInp'

				name='version'

				type='text'
			/> <!-- What: Netlify Version Input Element. Why: Netlify registers the version field by its name. How: This declares it. -->

			<label for='netBroInp'>Browser</label> <!-- What: Netlify Browser Label Element. Why: The browser field needs a label in Netlify's record of the form. How: This labels netBroInp. -->

			<input
				id='netBroInp'

				name='browser'

				type='text'
			/> <!-- What: Netlify Browser Input Element. Why: Netlify registers the browser field by its name. How: This declares it. -->

			<label for='netBotInp'>Leave this empty</label> <!-- What: Netlify Bot Label Element. Why: The honeypot field needs a label in Netlify's record of the form. How: This labels netBotInp. -->

			<input
				id='netBotInp'

				name='bot-field'

				type='text'
			/> <!-- What: Netlify Bot Input Element. Why: Netlify marks as spam a message that fills its honeypot field. How: This declares the field the form's netlify-honeypot attribute names. -->


		</form>


		<script
			src='/src/main.tsx'
			type='module'
		>/* What: App Module Script Element. Why: This loads the app itself. How: Vite replaces it with the built, hashed bundle at build time. */</script>


	</body>


</html>
