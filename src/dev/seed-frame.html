


<!doctype html> <!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'> <!-- What: Root HTML Element. Why: Screen readers and translation tools need the page's language. How: This marks the document as English. -->


	<head> <!-- What: Document Head Element. Why: The page's metadata loads before the body paints. How: This holds it in the section below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />            <!-- What: Character Set Meta. Why: The browser has to decode the page as UTF-8 before it reads anything else. How: This sits first in the head. -->
		<title>Come Hang seed frame</title> <!-- What: Page Title Element. Why: Every document needs a title, even one nobody sees. How: This names the frame the seed acts in. -->

		<!-- #endregion Document -->


	</head>



	<body></body> <!-- What: Document Body Element. Why: The seed only needs a page of the app's origin to load the app's modules in, as one member. How: This stays empty, since the Vite dev server serves the page and nothing renders in it. -->


</html>
